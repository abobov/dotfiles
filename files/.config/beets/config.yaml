---
# Inspired by: https://github.com/trapd00r/configs/blob/master/beets/config.yaml
library: ~/Music/beets.db
plugins:
  - albumtypes
  - musicbrainz
  - play
  - discogs
  - duplicates
  - edit
  - embedart
  - fetchart
  - filefilter
  - fromfilename
  - ftintitle
  - info
  - lastgenre
  - mbsync
  - missing
  - rewrite
original_date: true

albumtypes:
  types:
    - single: 'Single'
    - soundtrack: 'OST'
    - live: 'Live'
    - compilation: 'Anthology'
    - remix: 'Remix'
  ignore_va: compilation

play:
  command: mpv --no-resume-playback

fetchart:
  minwidth: 500
  maxwidth: 1200
  sources:
    - filesystem
    - itunes
    - amazon
    - fanarttv
    - albumart
    - coverart
    - wikipedia
    - google
    - '*'

embedart:
  auto: true
  ifempty: true
  remove_art_file: false

duplicates:
  album: true
  path: true
  tiebreak:
    items:
      - bitrate

musicbrainz:
  extra_tags:
    - year
    - originalyear
    - label

match:
  strong_rec_thresh: 0.10  # automatically accept any matches above 90% similarity
  ignored: missing_tracks unmatched_tracks
  ignored_media:
    - 'Data CD'
    - 'DVD'
    - 'DVD-Video'
    - 'Blu-ray'
    - 'HD-DVD'
    - 'VCD'
    - 'SVCD'
    - 'UMD'
    - 'VHS'

edit:
  itemfields: track title artist album year
  albumfields: track title artist albumartist album year

import:
  languages:
    - ru
    - en

ui:
  color: false

paths:
  default: $albumartist/$year - $album%aunique{}/$track - $title
  albumtype:live: $albumartist/Live/$year - $album%aunique{}/$track - $title
  albumtype:remix: $albumartist/Remix/$year - $album%aunique{}/$track - $title
  albumtype:compilation: $albumartist/Anthology/$year - $album%aunique{}/$track - $title
